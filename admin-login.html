<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avielle Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f7f2ed;
        --panel: rgba(255, 255, 255, 0.78);
        --ink: #1d1a17;
        --muted: #5a514b;
        --border: rgba(32, 26, 22, 0.08);
        --gold: #b79d72;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #f4eee9, #efe4dc);
        font-family: "Manrope", Arial, sans-serif;
        color: var(--ink);
        display: grid;
        place-items: center;
      }
      .login-card {
        width: min(480px, calc(100% - 2rem));
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 2rem;
        box-shadow: 0 18px 35px rgba(32, 26, 22, 0.08);
      }
      .brand {
        text-align: center;
        margin-bottom: 1.4rem;
      }
      .brand-mark {
        display: inline-grid;
        place-items: center;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--gold), #ddd3bf);
        font-family: "Cormorant Garamond", serif;
        font-size: 2rem;
        margin-bottom: 0.7rem;
      }
      h1 {
        margin: 0;
        font-size: 2rem;
        font-family: "Cormorant Garamond", serif;
      }
      .subtitle {
        color: var(--muted);
        text-align: center;
        margin: 0.4rem 0 1.75rem;
      }
      form {
        display: grid;
        gap: 1rem;
      }
      label {
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--muted);
      }
      input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 0.85rem 0.9rem;
        font: inherit;
      }
      button {
        margin-top: 0.3rem;
        border: none;
        border-radius: 999px;
        padding: 0.95rem 1.3rem;
        background: #1d1a17;
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
      .error {
        color: #8b4136;
        min-height: 1.2rem;
        font-size: 0.9rem;
      }
      .success {
        color: #1d5b3d;
        min-height: 1.2rem;
        font-size: 0.9rem;
      }
      .link-back {
        text-align: center;
        margin-top: 1rem;
        font-size: 0.9rem;
      }
      .inline-link {
        background: none;
        border: none;
        color: var(--ink);
        text-decoration: underline;
        cursor: pointer;
        padding: 0;
        font: inherit;
      }
      .hidden { display: none; }
      a { color: var(--ink); }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="brand">
        <div class="brand-mark">A</div>
        <h1>Avielle Admin</h1>
      </div>
      <p class="subtitle">Secure access to the Avielle dashboard</p>

      <div id="login-panel">
        <form id="admin-login-form">
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="Enter email" required />
          </div>
          <div>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter password" required />
          </div>
          <div class="error" id="login-error"></div>
          <button type="submit">Sign in</button>
        </form>

        <div class="link-back">
          <button class="inline-link" id="show-reset-link" type="button">Forgot password?</button>
          <div style="margin-top: 0.75rem;"><a href="/">Back to public store</a></div>
        </div>
      </div>

      <div id="reset-panel" class="hidden">
        <form id="forgot-password-form">
          <div>
            <label for="reset-email">Admin email</label>
            <input id="reset-email" name="reset-email" type="email" placeholder="Enter admin email" required />
          </div>
          <div class="error" id="reset-error"></div>
          <div class="success" id="reset-success"></div>
          <button type="submit">Send verification code</button>
        </form>

        <form id="reset-code-form" class="hidden" style="margin-top: 1rem;">
          <div>
            <label for="reset-code">Verification code</label>
            <input id="reset-code" name="reset-code" type="text" inputmode="numeric" maxlength="6" placeholder="Enter verification code" required />
          </div>
          <div>
            <label for="new-password">New password</label>
            <input id="new-password" name="new-password" type="password" placeholder="Enter new password" required />
          </div>
          <div class="error" id="code-error"></div>
          <div class="success" id="code-success"></div>
          <button type="submit">Update password</button>
        </form>

        <div class="link-back">
          <button class="inline-link" id="back-to-login" type="button">Back to login</button>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById('admin-login-form');
      const errorBox = document.getElementById('login-error');
      const resetPanel = document.getElementById('reset-panel');
      const loginPanel = document.getElementById('login-panel');
      const forgotForm = document.getElementById('forgot-password-form');
      const resetCodeForm = document.getElementById('reset-code-form');
      const resetError = document.getElementById('reset-error');
      const resetSuccess = document.getElementById('reset-success');
      const codeError = document.getElementById('code-error');
      const codeSuccess = document.getElementById('code-success');

      const toggleResetPanel = (show) => {
        loginPanel.classList.toggle('hidden', show);
        resetPanel.classList.toggle('hidden', !show);
        resetError.textContent = '';
        resetSuccess.textContent = '';
        codeError.textContent = '';
        codeSuccess.textContent = '';
      };

      document.getElementById('show-reset-link').addEventListener('click', () => toggleResetPanel(true));
      document.getElementById('back-to-login').addEventListener('click', () => toggleResetPanel(false));

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.textContent = '';
        const payload = {
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        };

        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const result = await response.json();

          if (!response.ok || !result.success) {
            throw new Error(result.message || 'Invalid login details.');
          }

          window.location.href = '/admin';
        } catch (error) {
          errorBox.textContent = error.message || 'Login failed.';
        }
      });

      forgotForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        resetError.textContent = '';
        resetSuccess.textContent = '';
        const email = document.getElementById('reset-email').value.trim();

        try {
          const response = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const result = await response.json();

          if (!response.ok || !result.success) {
            throw new Error(result.message || 'Unable to send reset code.');
          }

          resetSuccess.textContent = result.message || 'Verification code sent.';
          if (result.code) {
            resetSuccess.textContent += ` Code: ${result.code}`;
          }
          resetCodeForm.classList.remove('hidden');
        } catch (error) {
          resetError.textContent = error.message || 'Unable to send reset code.';
        }
      });

      resetCodeForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        codeError.textContent = '';
        codeSuccess.textContent = '';

        const email = document.getElementById('reset-email').value.trim();
        const code = document.getElementById('reset-code').value.trim();
        const newPassword = document.getElementById('new-password').value;

        try {
          const verifyResponse = await fetch('/api/auth/verify-reset-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, code })
          });
          const verifyResult = await verifyResponse.json();

          if (!verifyResponse.ok || !verifyResult.success) {
            throw new Error(verifyResult.message || 'Verification failed.');
          }

          const resetResponse = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, code, newPassword })
          });
          const resetResult = await resetResponse.json();

          if (!resetResponse.ok || !resetResult.success) {
            throw new Error(resetResult.message || 'Password reset failed.');
          }

          codeSuccess.textContent = resetResult.message || 'Password updated successfully.';
          setTimeout(() => toggleResetPanel(false), 1500);
        } catch (error) {
          codeError.textContent = error.message || 'Password reset failed.';
        }
      });
    </script>
  </body>
</html>
